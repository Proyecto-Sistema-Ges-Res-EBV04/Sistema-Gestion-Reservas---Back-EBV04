# Nombre de la aplicación
spring.application.name=reservas-backend

# Puerto: Render lo entrega en la variable PORT; en local se usa 8080
server.port=${PORT:8080}

# Configuración de la base de datos
# En Render se leen de variables de entorno (DB_URL, DB_USERNAME, DB_PASSWORD).
# Si no existen (en local), se usa lo que va después de los dos puntos.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservas_db}
spring.datasource.username=${DB_USERNAME:usr_agenda}
spring.datasource.password=${DB_PASSWORD:Cun0RYz0Y7g6}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Hibernate: crea/actualiza las tablas automáticamente según tus entidades
spring.jpa.defer-datasource-initialization=true

# Clave para firmar los tokens JWT. En Render va en la variable JWT_SECRET.
jwt.secret=${JWT_SECRET:clave-secreta-super-larga-para-firmar-los-tokens-jwt-1234567890}

# Orígenes (dominios del front) que pueden llamar al back, separados por coma.
# En Render va en la variable CORS_ORIGENES (ej. http://localhost:5173,https://mi-front.vercel.app).
cors.origenes=${CORS_ORIGENES:http://localhost:5173}
