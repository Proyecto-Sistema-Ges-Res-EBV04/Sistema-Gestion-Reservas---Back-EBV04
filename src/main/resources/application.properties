# Nombre de la aplicación
spring.application.name=reservas-backend

# Configuración de la base de datos 
spring.datasource.url=jdbc:postgresql://localhost:5432/reservas_db
spring.datasource.username=postgres
spring.datasource.password=no_olvidar_123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Hibernate: crea/actualiza las tablas automáticamente según tus entidades
spring.jpa.defer-datasource-initialization=true